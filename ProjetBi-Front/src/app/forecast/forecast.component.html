<div class="main">
  <!-- ── NAVBAR (Unified Design) ── -->
  <nav class="navbar">
    <div class="navbar-brand" (click)="goHome()" style="cursor: pointer;">
      <div class="back-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </div>
      <div class="logo-icon-sm">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="navbar-title">Forecast Intelligence</div>
    </div>

    <div class="navbar-actions">
      <!-- Price Regression Link -->
      <div class="icon-btn regression-btn" (click)="openRegression()" title="Price Regression Analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16c0de" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>

      <!-- Forecast (Active - we are on this page) -->
      <div class="icon-btn forecast-btn active" title="Time-Series Forecast">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16c0de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
          <path d="M8 12h.01M12 12h.01M16 12h.01"></path>
        </svg>
      </div>

      <!-- PDF Export -->
      <div class="icon-btn export-pdf" (click)="exportPDF()" title="Export PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M12 18v-6m0 0l-3 3m3-3l3 3"></path>
        </svg>
      </div>

      <!-- Excel Export -->
      <div class="icon-btn export-excel" (click)="exportExcel()" title="Export Excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </div>

      <div class="divider"></div>

      <!-- User Profile -->
      <div class="user-profile-sm">
        <div class="user-avatar-sm">{{ userInitials }}</div>
        <div class="user-info-sm">
          <div class="user-name-sm">{{ fullName }}</div>
          <div class="user-role-sm">{{ userRole }}</div>
        </div>
      </div>

      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </nav>

  <!-- ── CONTENT ── -->
  <div class="content-scroll">
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>L'IA analyse les données en temps réel...</p>
    </div>
    <iframe *ngIf="!isLoading && forecastHtml" [src]="forecastHtml" frameborder="0"></iframe>
  </div>
</div>
