<div class="main">
  <!-- ── NAVBAR (Unified Design) ── -->
  <nav class="navbar">
    <div class="navbar-brand" (click)="goHome()" style="cursor: pointer;">
      <div class="logo-icon-sm">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="navbar-title">Demand Forecast <span>AI Predictions</span></div>
    </div>

    <div class="navbar-actions">
      <!-- Price Regression Link -->
      <div class="icon-btn regression-btn" (click)="openRegression()" title="Price Regression Analysis"
        appSoundVisual="Price regression analysis.">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16c0de" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>



      <!-- Refresh Forecast -->
      <div class="icon-btn refresh-btn" (click)="loadForecast()" title="Refresh Forecast" appSoundVisual="Refresh AI forecast data.">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </div>

      <!-- Forecast -->
      <div class="icon-btn forecast-btn" title="Time-Series Forecast" appSoundVisual="Time-series forecast analysis.">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16c0de" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
          <path d="M8 16l2-2 2 2 4-4" stroke-width="2.5"></path>
        </svg>
      </div>

      <!-- Excel Export -->
      <div class="icon-btn export-excel" (click)="exportExcel()" title="Export to Google Sheets"
        appSoundVisual="Export data to Google Sheets." *ngIf="userRole !== 'CEO'">
        <svg viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </div>

      <!-- ICON NOTIFS -->
      <div class="icon-btn" (click)="toggleNotifs()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </div>

      <!-- ICON MESSAGERIE -->
      <div class="icon-btn" (click)="toggleChat()" title="Messages directs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>

      <!-- USER MANAGEMENT -->
      <div class="icon-btn" (click)="openUsersModal()" title="Manage users access"
        appSoundVisual="Manage users access.">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>

      <!-- Accessibility Sound Toggle -->
      <div class="icon-btn sound-btn" (click)="toggleSound()"
        [title]="isSoundEnabled ? 'Disable Voice Assistance' : 'Enable Voice Assistance'">
        <svg *ngIf="isSoundEnabled" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg *ngIf="!isSoundEnabled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </div>

      <div class="divider"></div>

      <div class="user-profile-sm">
        <div class="user-avatar-sm">{{ userInitials }}</div>
        <div class="user-info-sm">
          <div class="user-name-sm">{{ fullName }}</div>
          <div class="user-role-sm">{{ userRole }}</div>
        </div>
      </div>

      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </nav>

  <!-- ── CONTENT ── -->
  <div class="content-scroll" appSoundVisual="Time-series forecast report view.">
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>L'IA analyse les données en temps réel...</p>
    </div>
    <div class="iframe-container" *ngIf="!isLoading && forecastHtml">
      <iframe [src]="forecastHtml" frameborder="0"></iframe>
    </div>

    <div class="summary-fab" (mouseenter)="hoverSummary()" (click)="readSummary()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <span class="fab-text">Read Summary</span>
    </div>
  </div>
</div>
