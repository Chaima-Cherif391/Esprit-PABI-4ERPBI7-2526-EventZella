<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />

</head>

<body>

  <!-- BACKGROUND IMAGE -->
  <div class="bg"></div>

  <!-- PAGE -->
  <div class="page">

    <!-- LEFT : Texte -->
    <div class="left-content">
      <img src="/images/eventzilla-logo.png" alt="logo" class="tag-logo">
      <h4>
        <span
          style="color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.3em; display: block; margin-bottom: 6px;">✦
          WELCOME</span>
        LOGIN PAGE
      </h4>
      <p
        style="font-size: 18px; font-family: 'Palatino', serif; line-height: 1.7; color: rgba(255,255,255,0.80); border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; max-width: 400px;">
        Eventzilla is the only platform offering event organizers enterprise-level features – from registration to
        marketing, management and analytics – all through an easy-to-use interface and at an affordable price.</p>
    </div>

    <!-- RIGHT -->
    <div class="form-card">
      <h2>Login to your profile</h2>

      <!-- Message d'erreur (géré par SweetAlert2) -->

      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <input type="email" placeholder="Enter email" [(ngModel)]="email" autocomplete="email" />
      </div>

      <div class="input-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input type="password" placeholder="Enter Password" [(ngModel)]="password" autocomplete="current-password" />
      </div>

      <button class="btn-login" (click)="onLogin()" [disabled]="loading">
        {{ loading ? 'Connecting...' : 'Login' }}
      </button>

      <div class="forgot-password-link">
        <a href="javascript:void(0)" (click)="onForgotPassword()">Forgot Password?</a>
      </div>

  </div>
