<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forecast Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="background:#1a1a2e; padding:20px; font-family:Arial">

  <h2 style="color:white; text-align:center">
    📈 Forecast Réservations - ETS
  </h2>

  <h4 style="color:#aaa; text-align:center">
    MAPE: 11.96% | MAE: 2150.57
  </h4>

  <table style="color:white; margin:auto; border-collapse:collapse; margin-bottom:20px">
    <tr style="background:#00d4ff; color:black">
      <th style="padding:10px 20px">Mois</th>
      <th style="padding:10px 20px">Réservations prévues</th>
    </tr>

    
    <tr style="background:#16213e">
      <td style="padding:10px 20px; text-align:center">2026-01</td>
      <td style="padding:10px 20px; text-align:center">19 449</td>
    </tr>
    <tr style="background:#0f3460">
      <td style="padding:10px 20px; text-align:center">2026-02</td>
      <td style="padding:10px 20px; text-align:center">15 658</td>
    </tr>
    <tr style="background:#16213e">
      <td style="padding:10px 20px; text-align:center">2026-03</td>
      <td style="padding:10px 20px; text-align:center">18 359</td>
    </tr>
    <tr style="background:#0f3460">
      <td style="padding:10px 20px; text-align:center">2026-04</td>
      <td style="padding:10px 20px; text-align:center">15 643</td>
    </tr>
    <tr style="background:#16213e">
      <td style="padding:10px 20px; text-align:center">2026-05</td>
      <td style="padding:10px 20px; text-align:center">21 158</td>
    </tr>
    <tr style="background:#0f3460">
      <td style="padding:10px 20px; text-align:center">2026-06</td>
      <td style="padding:10px 20px; text-align:center">17 166</td>
    </tr>

  </table>

  <canvas id="chart"></canvas>

  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06"],
        datasets: [{
          label: 'Réservations prévues',
          data: [19449,15658,18359,15643,21158,17166],
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0,212,255,0.1)',
          borderWidth: 3,
          pointRadius: 6,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        plugins: {
          legend: {
            labels: { color: 'white' }
          }
        },
        scales: {
          x: {
            ticks: { color: 'white' },
            grid: { color: '#333' }
          },
          y: {
            ticks: { color: 'white' },
            grid: { color: '#333' }
          }
        }
      }
    });
  </script>

</body>
</html>
