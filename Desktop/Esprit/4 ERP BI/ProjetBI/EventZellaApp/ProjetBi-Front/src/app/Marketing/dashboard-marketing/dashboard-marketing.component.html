<!-- layout.component.html -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span class="logo-text">EVENT<span>ZILLA</span></span>
    </div>
  </div>

  <!-- ══ SECTION PRINCIPALE ══ -->
  <div class="sidebar-section">
    <div class="section-label">Principal</div>

    <a class="nav-item" [class.active]="isActive('/dashboard')" (click)="navigateTo('/dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Vue d'ensemble
    </a>
   <!-- <a class="nav-item" [class.active]="isActive('/content-ceo')" (click)="navigateTo('/content-ceo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Dashboard
    </a> -->
    <a class="nav-item" [class.active]="isActive('/events')" (click)="navigateTo('/events')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
      </svg>
      Événements
      <span class="nav-badge">12</span>
    </a>

    <a class="nav-item" [class.active]="isActive('/participants')" (click)="navigateTo('/participants')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Participants
    </a>

    <a class="nav-item" [class.active]="isActive('/finances')" (click)="navigateTo('/finances')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      Finances
    </a>
  </div>

  <!-- ══ SECTION GESTION ══ -->
  <div class="sidebar-section">
    <div class="section-label">Gestion</div>

    <a class="nav-item" [class.active]="isActive('/reports')" (click)="navigateTo('/reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      Rapports
    </a>

    <a class="nav-item" [class.active]="isActive('/marketing')" (click)="navigateTo('/marketing')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      Marketing
    </a>

    <a class="nav-item" [class.active]="isActive('/sponsors')" (click)="navigateTo('/sponsors')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 20V10"/>
        <path d="M12 20V4"/>
        <path d="M6 20v-6"/>
      </svg>
      Sponsors
      <span class="nav-badge">3</span>
    </a>

    <a class="nav-item" [class.active]="isActive('/settings')" (click)="navigateTo('/settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
      </svg>
      Paramètres
    </a>
  </div>

  <!-- ══ USER CARD ══ -->
  <div class="sidebar-bottom">
    <div class="user-card">
      <div class="user-avatar">MG</div>
      <div class="user-info">
       <div class="user-name">{{ fullName }}</div>
        <div class="user-role">Département Marketing </div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="1"/>
        <circle cx="12" cy="5" r="1"/>
        <circle cx="12" cy="19" r="1"/>
      </svg>
    </div>
  </div>
</aside>

<!-- ══ MAIN ══ -->
<div class="main">

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div class="navbar-title">
      Tableau de bord Marketing
      <span>Lundi, 14 Avril 2026</span>
    </div>

    <div class="navbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Rechercher…" />
    </div>

    <div class="navbar-actions">
      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-dot"></span>
      </div>

      <div class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>

      <button class="btn-connect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Connexion
      </button>
    </div>
  </nav>

  <!-- ── CONTENU DYNAMIQUE (router-outlet) ── -->
  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>
